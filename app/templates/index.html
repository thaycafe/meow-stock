{% extends "base.html" %}
{% set active_tab = "list" %}
{% block title %}{{ t.nav_list }} — {{ t.app_title }}{% endblock %}

{% block main %}
<div id="shopping-list">
  {% include "partials/shopping_list.html" %}
</div>
{% endblock %}

{% block bottom %}
<div class="sticky bottom-0 bg-white dark:bg-gray-800 border-t border-gray-100 dark:border-gray-700 px-4 py-3 space-y-2"
     x-data='addItemForm({ alwaysOpen: true, target: "#shopping-list", needUrl: "/list/items/:id/need", genericError: {{ t.error_generic | tojson }} })'
     @htmx:after-request="afterRequest($event)">
  <form x-ref="form" hx-post="/list/items" hx-target="#shopping-list" hx-swap="innerHTML" hx-disabled-elt="find button[type=submit]" class="flex gap-2">
    <input x-ref="name" type="text" name="name" required placeholder="{{ t.placeholder_list_add }}" aria-label="{{ t.placeholder_list_add }}"
      @input="error = ''; existingId = null"
      class="flex-1 min-w-0 border border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 dark:placeholder-gray-400 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand" />
    <button type="submit"
      class="min-h-11 flex items-center gap-1.5 px-4 bg-brand text-white rounded-lg text-sm font-medium hover:bg-brand-dark transition-colors disabled:opacity-60">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      {{ t.btn_add }}
    </button>
  </form>
  {% include "partials/add_error.html" %}
</div>
{% endblock %}
