{% extends "base.html" %}
{% block title %}{{ t.stock_title }} — {{ t.app_title }}{% endblock %}
{% block body %}

<div class="min-h-full flex flex-col max-w-2xl mx-auto"
     x-data="{
       showForm: false,
       dark: document.documentElement.classList.contains('dark'),
       toggle() {
         this.dark = !this.dark;
         document.documentElement.classList.toggle('dark', this.dark);
         localStorage.theme = this.dark ? 'dark' : 'light';
       }
     }">

  <header class="sticky top-0 z-10 bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 px-4 pt-4 pb-0 shadow-sm">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <img src="/static/favicon.png" class="w-7 h-7" />
        <h1 class="text-lg font-bold text-gray-800 dark:text-gray-100">{{ t.app_title }}</h1>
      </div>
      <div class="flex items-center gap-3">
        <button @click="toggle()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
          <svg x-show="!dark" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
          <svg x-show="dark" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>
        <form method="post" action="/lang/pt"><button class="text-xs {% if lang == 'pt' %}text-brand font-semibold{% else %}text-gray-400 hover:text-gray-600 dark:hover:text-gray-300{% endif %} transition-colors">PT</button></form>
        <span class="text-gray-200 dark:text-gray-600 text-xs">|</span>
        <form method="post" action="/lang/en"><button class="text-xs {% if lang == 'en' %}text-brand font-semibold{% else %}text-gray-400 hover:text-gray-600 dark:hover:text-gray-300{% endif %} transition-colors">EN</button></form>
      </div>
    </div>
    <div class="flex gap-1">
      <a href="/list" class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 dark:text-gray-400 hover:text-brand transition-colors">{{ t.nav_list }}</a>
      <a href="/stock" class="px-4 py-2 text-sm font-medium border-b-2 border-brand text-brand">{{ t.nav_stock }}</a>
    </div>
  </header>

  <main class="flex-1 px-4 py-4">
    <div id="stock-list">
      {% include "partials/stock_list.html" %}
    </div>
  </main>

  <div class="sticky bottom-0 bg-white dark:bg-gray-800 border-t border-gray-100 dark:border-gray-700 px-4 py-4">
    <div x-show="!showForm" x-transition>
      <button @click="showForm = true"
        class="w-full flex items-center justify-center gap-2 bg-brand text-white rounded-xl py-3.5 font-medium shadow-lg hover:bg-brand-dark transition-all active:scale-95">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        {{ t.btn_add_stock_item }}
      </button>
    </div>
    <div x-show="showForm" x-transition>
      <form hx-post="/stock/items" hx-target="#stock-list" hx-swap="innerHTML"
            hx-on::after-request="showForm = false; $el.reset()" class="space-y-3">
        <input type="text" name="name" placeholder="{{ t.placeholder_item_name }}" required autofocus
          class="w-full border border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 dark:placeholder-gray-400 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand" />
        <div class="flex gap-2">
          <select name="category_id"
            class="flex-1 border border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
            <option value="">{{ t.placeholder_no_category }}</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ translate_category(cat) }}</option>
            {% endfor %}
          </select>
          <select name="status"
            class="border border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
            <option value="normal" selected>{{ t.status_normal }}</option>
            <option value="running_low">{{ t.status_running_low }}</option>
            <option value="out_of_stock">{{ t.status_out_of_stock }}</option>
          </select>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="flex-1 bg-brand text-white rounded-lg py-2.5 text-sm font-medium hover:bg-brand-dark transition-colors">{{ t.btn_add }}</button>
          <button type="button" @click="showForm = false" class="border border-gray-200 dark:border-gray-600 dark:text-gray-300 text-gray-500 rounded-lg px-4 py-2.5 text-sm hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">✕</button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
